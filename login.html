<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Bright Future Coaching</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(rgba(13,110,253,.75),rgba(13,110,253,.75)),
url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=1600");

background-size:cover;
background-position:center;

overflow:hidden;

}

/* Login Box */

.container{

width:950px;

max-width:95%;

display:grid;

grid-template-columns:1fr 1fr;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border-radius:25px;

overflow:hidden;

box-shadow:0 20px 50px rgba(0,0,0,.25);

}

/* Left */

.left{

background:linear-gradient(135deg,#0d6efd,#3f8cff);

padding:60px 40px;

color:white;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

}

.left h1{

font-size:40px;

margin-bottom:20px;

}

.left p{

line-height:30px;

font-size:17px;

margin-bottom:25px;

}

.left img{

width:280px;

border-radius:20px;

box-shadow:0 15px 30px rgba(0,0,0,.2);

}

/* Right */

.right{

padding:50px 40px;

background:white;

}

.right h2{

text-align:center;

color:#0d6efd;

margin-bottom:30px;

font-size:32px;

}

.input-box{

position:relative;

margin-bottom:20px;

}

.input-box i{

position:absolute;

left:15px;

top:17px;

color:#0d6efd;

}

.input-box input{

width:100%;

padding:15px 15px 15px 45px;

border:2px solid #ddd;

border-radius:40px;

outline:none;

transition:.3s;

font-size:15px;

}

.input-box input:focus{

border-color:#0d6efd;

}

.options{

display:flex;

justify-content:space-between;

font-size:14px;

margin-bottom:25px;

}

.options a{

text-decoration:none;

color:#0d6efd;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:40px;

background:#0d6efd;

color:white;

font-size:17px;

cursor:pointer;

transition:.4s;

}

button:hover{

background:#ff6b00;

}

.or{

text-align:center;

margin:20px 0;

color:#666;

}

.social{

display:flex;

justify-content:center;

gap:15px;

}

.social a{

width:45px;

height:45px;

display:flex;

justify-content:center;

align-items:center;

border-radius:50%;

background:#f2f2f2;

color:#0d6efd;

font-size:20px;

text-decoration:none;

transition:.4s;

}

.social a:hover{

background:#0d6efd;

color:white;

transform:translateY(-5px);

}

.register{

text-align:center;

margin-top:25px;

}

.register a{

color:#0d6efd;

text-decoration:none;

font-weight:600;

}

/* Responsive */

@media(max-width:850px){

.container{

grid-template-columns:1fr;

}

.left{

display:none;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>Bright Future Coaching</h1>

<p>

Welcome Back!

Login to continue your learning journey with India's Best Coaching Institute.

</p>

<img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=700" alt="Students">

</div>

<div class="right">

<h2>Login</h2>

<form>

<div class="input-box">

<i class="fas fa-envelope"></i>

<input type="email" placeholder="Email Address" required>

</div>

<div class="input-box">

<i class="fas fa-lock"></i>

<input type="password" placeholder="Password" required>

</div>

<div class="options">

<label>

<input type="checkbox">

 Remember Me

</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">

Login Now

</button>

<div class="or">

----------- OR -----------

</div>

<div class="social">

<a href="#"><i class="fab fa-google"></i></a>

<a href="#"><i class="fab fa-facebook-f"></i></a>

<a href="#"><i class="fab fa-linkedin-in"></i></a>

</div>

<div class="register">

Don't have an account?

<a href="register.html">

Register Here

</a>

</div>

</form>

</div>

</div>

</body>
</html>
