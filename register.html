<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Bright Future Coaching</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

background:
linear-gradient(rgba(13,110,253,.75),rgba(13,110,253,.75)),
url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=1600");

background-size:cover;
background-position:center;
padding:30px;
}

.container{

width:1100px;
max-width:100%;

display:grid;
grid-template-columns:1fr 1fr;

background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);

border-radius:25px;

overflow:hidden;

box-shadow:0 20px 50px rgba(0,0,0,.25);

}

/* LEFT */

.left{

background:linear-gradient(135deg,#0d6efd,#4b8dff);

color:white;

padding:60px 40px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

}

.left h1{

font-size:42px;

margin-bottom:20px;

}

.left p{

line-height:30px;

margin-bottom:30px;

}

.left img{

width:300px;

max-width:100%;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.25);

}

/* RIGHT */

.right{

background:white;

padding:45px;

}

.right h2{

text-align:center;

color:#0d6efd;

margin-bottom:30px;

font-size:34px;

}

.form-group{

margin-bottom:18px;

position:relative;

}

.form-group i{

position:absolute;

left:15px;

top:17px;

color:#0d6efd;

}

.form-group input,
.form-group select{

width:100%;

padding:15px 15px 15px 45px;

border:2px solid #ddd;

border-radius:40px;

outline:none;

font-size:15px;

transition:.3s;

}

.form-group input:focus,
.form-group select:focus{

border-color:#0d6efd;

}

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}

.gender{

margin:20px 0;

}

.gender label{

margin-right:20px;

font-size:15px;

}

.checkbox{

margin:20px 0;

font-size:14px;

}

.checkbox input{

margin-right:8px;

}

button{

width:100%;

padding:15px;

background:#0d6efd;

color:white;

border:none;

border-radius:40px;

font-size:17px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#ff6b00;

}

.login{

text-align:center;

margin-top:20px;

}

.login a{

text-decoration:none;

color:#0d6efd;

font-weight:600;

}

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

.left{

display:none;

}

.row{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>Join Bright Future</h1>

<p>

Register today and start your preparation with India's best coaching institute.

Learn from expert faculty and achieve your dream career.

</p>

<img src="https://images.unsplash.com/photo-1513258496099-48168024aec0?w=700">

</div>

<div class="right">

<h2>Create Account</h2>

<form>

<div class="row">

<div class="form-group">

<i class="fas fa-user"></i>

<input type="text" placeholder="First Name" required>

</div>

<div class="form-group">

<i class="fas fa-user"></i>

<input type="text" placeholder="Last Name" required>

</div>

</div>

<div class="form-group">

<i class="fas fa-envelope"></i>

<input type="email" placeholder="Email Address" required>

</div>

<div class="form-group">

<i class="fas fa-phone"></i>

<input type="tel" placeholder="Mobile Number" required>

</div>

<div class="form-group">

<i class="fas fa-graduation-cap"></i>

<select required>

<option>Select Course</option>

<option>IIT-JEE</option>

<option>NEET</option>

<option>SSC</option>

<option>Banking</option>

<option>CUET</option>

<option>NDA</option>

</select>

</div>

<div class="row">

<div class="form-group">

<i class="fas fa-lock"></i>

<input type="password" placeholder="Password" required>

</div>

<div class="form-group">

<i class="fas fa-lock"></i>

<input type="password" placeholder="Confirm Password" required>

</div>

</div>

<div class="gender">

<strong>Gender :</strong>

<label>

<input type="radio" name="gender">

 Male

</label>

<label>

<input type="radio" name="gender">

 Female

</label>

<label>

<input type="radio" name="gender">

 Other

</label>

</div>

<div class="checkbox">

<label>

<input type="checkbox" required>

I agree to the Terms & Conditions

</label>

</div>

<button type="submit">

Register Now

</button>

<div class="login">

Already have an account?

<a href="login.html">

Login Here

</a>

</div>

</form>

</div>

</div>

</body>
</html>
