<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Bright Future Coaching Institute</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        /* Natural Botanical & Herb Theme Variables (Matched with about.html, login.html etc.) */
        :root {
            --bg-cream: #FAF9F5;
            --card-bg: #FFFFFF;
            --text-main: #292524;
            --text-gray: #57534E;
            --accent-gold: #C28E38;
            --accent-terracotta: #4D7C0F;
            --gradient: linear-gradient(135deg, #4D7C0F 0%, #365314 100%);
            --border-color: rgba(41, 37, 36, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-cream);
            background-image: radial-gradient(circle at top center, rgba(77, 124, 15, 0.05), transparent 60%);
            color: var(--text-main);
            padding: 30px 20px;
            overflow-x: hidden;
        }

        /* Container Card */
        .container {
            width: 1050px;
            max-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(41, 37, 36, 0.06);
        }

        /* Left Side */
        .left {
            background: linear-gradient(135deg, rgba(77, 124, 15, 0.95), rgba(54, 83, 20, 0.9)), 
                        url("https://images.unsplash.com/photo-1513258496099-48168024aec0?w=1000");
            background-size: cover;
            background-position: center;
            padding: 50px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-right: 1px solid var(--border-color);
            position: relative;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            background: rgba(0, 0, 0, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .home-btn:hover {
            background: rgba(0, 0, 0, 0.3);
            color: var(--accent-gold);
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #FFFFFF;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .left h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            line-height: 1.2;
            font-weight: 700;
        }

        .left h1 span {
            color: var(--accent-gold);
        }

        .left p {
            line-height: 1.7;
            font-size: 0.95rem;
            color: #F5F5F4;
            margin-bottom: 30px;
        }

        .left img {
            width: 100%;
            max-width: 280px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        /* Right Form Side */
        .right {
            padding: 45px 40px;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .right-header h2 {
            font-size: 2.2rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .right-header p {
            font-size: 0.88rem;
            color: var(--text-gray);
            margin-top: 5px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-terracotta);
            font-size: 0.95rem;
            pointer-events: none;
            z-index: 2;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 18px 13px 48px;
            background: var(--bg-cream);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: var(--transition);
            appearance: none;
        }

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background: #FFFFFF;
            color: var(--text-main);
            padding: 10px;
        }

        .form-group input::placeholder {
            color: #A8A29E;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent-terracotta);
            background: #FFFFFF;
            box-shadow: 0 0 15px rgba(77, 124, 15, 0.1);
        }

        /* Gender Section */
        .gender {
            margin: 15px 0;
            font-size: 0.88rem;
            color: var(--text-gray);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .gender strong {
            color: var(--text-main);
        }

        .gender label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--text-main);
        }

        .gender input[type="radio"] {
            accent-color: var(--accent-terracotta);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Checkbox */
        .checkbox {
            margin: 15px 0 22px;
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .checkbox label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox input[type="checkbox"] {
            accent-color: var(--accent-terracotta);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Submit Button */
        button {
            width: 100%;
            padding: 14px;
            background: var(--gradient);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 0.98rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(77, 124, 15, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(77, 124, 15, 0.4);
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: var(--text-gray);
        }

        .login a {
            text-decoration: none;
            color: var(--accent-terracotta);
            font-weight: 600;
            margin-left: 5px;
            transition: var(--transition);
        }

        .login a:hover {
            color: var(--text-main);
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .left {
                display: none;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .right {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Left Showcase Side -->
        <div class="left">
            <a href="index.html" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            <span class="badge"><i class="fa-solid fa-user-plus"></i> Student Registration</span>
            <h1>Join <span>Bright Future</span></h1>
            <p>Register today and begin your journey toward academic success with India's premier coaching institute.</p>
            <img src="https://images.unsplash.com/photo-1513258496099-48168024aec0?w=700" alt="Learning Experience">
        </div>

        <!-- Right Form Side -->
        <div class="right">

            <div class="right-header">
                <h2>Create Account</h2>
                <p>Fill in your details to register for courses</p>
            </div>

            <form>

                <div class="row">
                    <div class="form-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="First Name" required>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Last Name" required>
                    </div>
                </div>

                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="form-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" placeholder="Mobile Number" required>
                </div>

                <div class="form-group">
                    <i class="fas fa-graduation-cap"></i>
                    <select required>
                        <option value="" disabled selected>Select Desired Course</option>
                        <option value="IIT-JEE">IIT-JEE (Main & Advanced)</option>
                        <option value="NEET">NEET Medical Entrance</option>
                        <option value="SSC">SSC (CGL, CHSL, MTS)</option>
                        <option value="Banking">Banking (IBPS, SBI PO)</option>
                        <option value="CUET">CUET Entrance Test</option>
                        <option value="NDA">NDA Defense Academy</option>
                    </select>
                </div>

                <div class="row">
                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Confirm Password" required>
                    </div>
                </div>

                <div class="gender">
                    <strong>Gender:</strong>
                    <label>
                        <input type="radio" name="gender" required> Male
                    </label>
                    <label>
                        <input type="radio" name="gender"> Female
                    </label>
                    <label>
                        <input type="radio" name="gender"> Other
                    </label>
                </div>

                <div class="checkbox">
                    <label>
                        <input type="checkbox" required>
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <button type="submit">
                    Register Now <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="login">
                    Already have an account?
                    <a href="login.html">Login Here</a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
